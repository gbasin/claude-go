name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go vet -tags e2e ./e2e/
      - run: go test -race ./...
      - run: cp go.mod /tmp/go.mod && cp go.sum /tmp/go.sum && go mod tidy && diff go.mod /tmp/go.mod && diff go.sum /tmp/go.sum

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags e2e -count=1 -timeout 10m ./e2e/
